data:
  dataset: FD001
  seq_len: 75
  rul_cap: 125
  stride: 1
  val_units_frac: 0.2

  max_train_rul: 60

  val_rul_min: 1
  val_rul_max: 125

training:
  seed: 42
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  loss: huber   # or mse
  huber_beta: 20

model:
  n_features: 24
  cnn_channels: 32
  cnn_kernel_size: 3
  gru_hidden_size: 64
  gru_num_layers: 1
  dropout: 0.0
  head_hidden_size: 64
  head_dropout: 0.3
  temporal_aggregation: last   
  
